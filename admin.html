<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Tacoa General Trading</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg?v=2" />
</head>
<body>

  <!-- Sign in -->
  <main id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Tacoa Admin</h1>
      <p class="muted">Sign in to manage stock, sales and accounts.</p>
      <label class="field"><span>Email</span>
        <input type="email" id="login-email" autocomplete="username" required />
      </label>
      <label class="field"><span>Password</span>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" hidden>
    <header class="topbar">
      <strong class="brand">Tacoa Admin</strong>
      <nav id="tabs" class="tabs" aria-label="Sections">
        <button type="button" data-tab="overview">Overview</button>
        <button type="button" data-tab="inventory">Inventory</button>
        <button type="button" data-tab="sales">Sales</button>
        <button type="button" data-tab="purchases">Purchases</button>
        <button type="button" data-tab="adjustments">Breakages &amp; Loss</button>
        <button type="button" data-tab="accounting">Accounting</button>
        <button type="button" data-tab="leads">Enquiries</button>
      </nav>
      <button type="button" id="logout" class="btn btn-ghost">Sign out</button>
    </header>
    <main id="panel" class="panel"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
          integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT"
          crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
